---
- name: create application and auth config
  template:
    src: "{{ item[0] }}.{{ item[1] }}.json.j2"
    dest: "{{ edxapp_app_dir }}/{{ item[0] }}.{{ item[1] }}.json"
    owner: "{{ edxapp_user }}"
    group: "{{ common_web_group }}"
    mode: 0640
  become: true
  with_nested:
    - "{{ service_variants_enabled }}"
    - [ 'env', 'auth' ]
  tags:
    - install
    - install:configuration
    - install:app-configuration
    - edxapp_cfg # Old deprecated tag, will remove when possible

- name: Patch to create application and auth config
  template:
    src: "{{ item[0] }}.{{ item[1] }}.json.triboo.upgrade.j2"
    dest: "{{ edxapp_app_dir }}/{{ item[0] }}.{{ item[1] }}.json"
    owner: "{{ edxapp_user }}"
    group: "{{ common_web_group }}"
    mode: 0640
  become: true
  with_nested:
    - "{{ service_variants_enabled }}"
    - [ 'env', 'auth' ]
  tags:
    - "triboo_upgrade_patch"
    - "never"    

# write the supervisor scripts for the service variants
- name: "writing {{ item }} supervisor script"
  template:
    src: "edx/app/supervisor/conf.d.available/{{ item }}.conf.j2"
    dest: "{{ supervisor_available_dir }}/{{ item }}.conf"
    owner: "{{ supervisor_user }}"
    group: "{{ supervisor_user }}"
    mode: 0644
  become_user: "{{ supervisor_user }}"
  with_items: "{{ service_variants_enabled }}"
  tags:
    - install
    - install:configuration
    - "triboo_upgrade"

# write the supervisor script for celery workers
- name: writing celery supervisor scripts
  template:
    src: "edx/app/supervisor/conf.d.available/{{ item }}.j2"
    dest: "{{ supervisor_available_dir }}/{{ item }}"
    owner: "{{ supervisor_user }}"
    group: "{{ supervisor_user }}"
    mode: 0644
  become_user: "{{ supervisor_user }}"
  with_items:
    - workers.conf
  tags:
    - install
    - install:configuration
    - "triboo_upgrade"

# clean out an old edxapp.conf file which we don't use now.
# this can be deleted after we build things from scratch.
- name: clean out old edxapp.conf
  file:
    path: "{{ supervisor_available_dir }}/edxapp.conf"
    state: "absent"
  tags:
    - install
    - install:configuration
    - "triboo_upgrade"

- name: add gunicorn configuration files
  template:
    src: "{{ item }}_gunicorn.py.j2"
    dest: "{{ edxapp_app_dir }}/{{ item }}_gunicorn.py"
    mode: 0644
  become_user: "{{ edxapp_user }}"
  with_items: "{{ service_variants_enabled }}"
  tags:
    - install
    - install:configuration
    - "triboo_upgrade"

# write the supervisor script for mongod and sshd
# this should only be run when provisioning a jenkins-worker container
- name: Set ignore_jenkins_worker_command when no tags present
  set_fact: ignore_jenkins_worker_command=true
  tags:
   - "triboo_upgrade"

- name: writing mongod and sshd supervisor scripts
  template:
    src: "edx/app/supervisor/conf.d.available/{{ item }}.j2"
    dest: "{{ supervisor_available_dir }}/{{ item }}"
    owner: "{{ supervisor_user }}"
    group: "{{ supervisor_user }}"
    mode: 0644
  become_user: "{{ supervisor_user }}"
  with_items:
    - mongod.conf
    - sshd.conf
  when: 'ignore_jenkins_worker_command is not defined'
  tags:
    - jenkins-worker
    - "triboo_upgrade"

- name: "enable mongod and sshd supervisor script"
  file:
    src: "{{ supervisor_available_dir }}/{{ item }}.conf"
    dest: "{{ supervisor_cfg_dir }}/{{ item }}.conf"
    state: link
    force: yes
  become_user: "{{ supervisor_user }}"
  with_items:
    - mongod
    - sshd
  when: 'ignore_jenkins_worker_command is not defined'
  tags:
    - jenkins-worker
    - "triboo_upgrade"

# Enable the supervisor jobs
- name: "enable {{ item }} supervisor script"
  file:
    src: "{{ supervisor_available_dir }}/{{ item }}.conf"
    dest: "{{ supervisor_cfg_dir }}/{{ item }}.conf"
    state: link
    force: yes
  become_user: "{{ supervisor_user }}"
  with_items: "{{ service_variants_enabled }}"
  when: celery_worker is not defined and not disable_edx_services
  tags:
    - install
    - install:configuration
    - "triboo_upgrade"

- name: enable celery worker supervisor script
  file:
    src: "{{ supervisor_available_dir }}/workers.conf"
    dest: "{{ supervisor_cfg_dir }}/workers.conf"
    state: link
    force: yes
  become_user: "{{ supervisor_user }}"
  when: celery_worker is defined and not disable_edx_services
  tags:
    - install
    - install:configuration
    - "triboo_upgrade"

- name: create helper scripts for managing edxapp
  template:
    src: "edx/bin/{{ item[0] }}-{{ item[1] }}.j2"
    dest: "{{ COMMON_BIN_DIR }}/{{ item[0] }}-{{ item[1] }}"
    owner: "{{ edxapp_user }}"
    mode: 0755
  with_nested:
    - "{{ edxapp_helper_scripts }}"
    - "{{ service_variants_enabled }}"
  tags:
    - install
    - install:configuration
    - "triboo_upgrade"

- name: create script to compile and update assets
  template:
    src: "edx/bin/edxapp-update-assets.j2"
    dest: "{{ COMMON_BIN_DIR }}/edxapp-update-assets"
    owner: "{{ edxapp_user }}"
    mode: 0755
  tags:
    - install
    - install:configuration
    - "triboo_upgrade"

- name: Patch to install legacy xmlsec1 system package
  block:
    - name: Remove xmlsec1 system package
      apt: 
        name: libxmlsec1-dev
        state: absent
    - name: Download legacy xmlsec1 source package
      get_url:
        url: https://www.aleksey.com/xmlsec/download/older-releases/xmlsec1-1.2.20.tar.gz
        dest: /opt/xmlsec1-1.2.20.tar.gz
    - name: Unarchive legacy xmlsec1 package
      unarchive:
        src: /opt/xmlsec1-1.2.20.tar.gz
        dest: /opt
        remote_src: yes 
    - name: Create legacy xmlsec1 folder 
      file:
        path: /opt/xmlsec1-compat
        state: directory
    - name: Compile legacy xmlsec1 package
      shell: ./configure --prefix=/opt/xmlsec1-compat --with-openssl=/opt/ssl-1.0.2 --disable-crypto-dl
      args:
        chdir: /opt/xmlsec1-1.2.20
      environment:
        LDFLAGS: -Wl,-rpath,/opt/ssl-1.0.2/lib
    - name: Install legacy xmlsec1 package
      shell: make && make install
      args:
        chdir: /opt/xmlsec1-1.2.20
      ignore_errors: true      
  become: yes
  when: pyenv_python_version | float  == 2.7
  tags:
    - "triboo_upgrade_patch"
    - "never"

- name: Patch to install dm.xmlsec.binding python library
  shell: "export PATH=/opt/xmlsec1-compat/bin:$PATH && {{ edxapp_venv_dir }}/bin/pip install --no-binary=dm.xmlsec.binding --no-cache-dir dm.xmlsec.binding==1.3.3"
  args:
    chdir: "{{ edxapp_code_dir }}"
  become_user: "{{ edxapp_user }}"
  environment:
    PKG_CONFIG_PATH: /opt/xmlsec1-compat/lib/pkgconfig
    CFLAGS: -I/opt/ssl-1.0.2/include -I/opt/xmlsec1-compat/include/xmlsec1 -Wno-implicit-function-declaration -std=gnu89
    LDFLAGS: -L/opt/ssl-1.0.2/lib -L/opt/xmlsec1-compat/lib -Wl,-rpath,/opt/ssl-1.0.2/lib:/opt/xmlsec1-compat/lib
  when: pyenv_python_version | float  == 2.7
  tags:
    - "triboo_upgrade_patch"
    - "never"

- name: Patch to install mysql-python python library
  block:
    - name: Install legacy libmysqlclient-dev and libmysqlclient20 system package
      shell: wget https://archive.ubuntu.com/ubuntu/pool/main/m/mysql-5.7/libmysqlclient20_5.7.33-0ubuntu0.16.04.1_amd64.deb -O libmysqlclient20_5.7.33-0ubuntu0.16.04.1_amd64.deb && dpkg -i libmysqlclient20_5.7.33-0ubuntu0.16.04.1_amd64.deb && wget https://archive.ubuntu.com/ubuntu/pool/main/m/mysql-5.7/libmysqlclient-dev_5.7.33-0ubuntu0.16.04.1_amd64.deb -O libmysqlclient-dev_5.7.33-0ubuntu0.16.04.1_amd64.deb && dpkg -i libmysqlclient-dev_5.7.33-0ubuntu0.16.04.1_amd64.deb
      args:
        chdir: ~/
      ignore_errors: true
      become: yes
    - name: Install mysql-python python library
      shell: "{{ edxapp_venv_dir }}/bin/pip install --no-binary=MySQL-python --no-cache-dir MySQL-python==1.2.5"
      args:
        chdir: "{{ edxapp_code_dir }}"
      become_user: "{{ edxapp_user }}"
  when: pyenv_python_version | float  == 2.7
  tags:
    - "triboo_upgrade_patch"
    - "never"

- name: Patch to install beautifulsoup4 python library
  shell: "{{ edxapp_venv_dir }}/bin/pip install beautifulsoup4==4.9.3"
  args:
    chdir: "{{ edxapp_code_dir }}"
  become_user: "{{ edxapp_user }}"
  when: pyenv_python_version | float  == 2.7
  tags:
    - "triboo_upgrade_patch"
    - "never"

- name: exit playbook
  fail:
    msg: "EXIT"
  tags:
    - "triboo_upgrade"

- name: fix migration confliction
  shell:
    executable: /bin/bash 
    chdir: /edx/app/edxapp/edx-platform
    cmd: "source /edx/app/edxapp/edxapp_env && python manage.py lms makemigrations --merge --noinput --settings aws"
  become_user: "{{ edxapp_user }}"
  tags:
    - "triboo_upgrade"

# migrate when the migrate user is overridden in extra vars
- name: migrate
  command: "{{ COMMON_BIN_DIR }}/edxapp-migrate-{{ item }}"
  when: migrate_db is defined and migrate_db|lower == "yes" and COMMON_MYSQL_MIGRATE_PASS and item != "lms-preview"
  run_once: yes
  environment:
    DB_MIGRATION_USER: "{{ COMMON_MYSQL_MIGRATE_USER }}"
    DB_MIGRATION_PASS: "{{ COMMON_MYSQL_MIGRATE_PASS }}"
  with_items: "{{ service_variants_enabled }}"
  tags:
    - migrate
    - "triboo_upgrade"

# There are problems with django collectstatic copying files.  It doesn't retain
# last modified timestamps, but relies on those same timestamps to know if a new file
# should be recopied.  While collectstatic --clear exists, it only clears some of the
# files in edxapp_staticfile_dir, it leaves postprocessed or otherwise hashed files.
# This ensures we have a totally clean directory.
- name: Remove and recreate the staticfiles directory so nothing stale can exist
  file:
      path: "{{ edxapp_staticfile_dir }}"
      state: "{{ item }}"
      owner: "{{ edxapp_user }}"
      group: "{{ common_web_group }}"
      mode:  "0755"
  when: celery_worker is not defined and not devstack
  with_items: ['absent', 'directory']
  tags:
    - gather_static_assets
    - assets
    - "triboo_upgrade"

# Gather assets using paver if possible
- name: "gather static assets with paver"
  command: "{{ COMMON_BIN_DIR }}/edxapp-update-assets"
  when: celery_worker is not defined and not devstack
  tags:
    - gather_static_assets
    - assets
    - "triboo_upgrade"

