---
type: CheckConfig
api_version: core/v2
metadata:
  name: check_memory_elasticsearch_metrics
  namespace: default
spec:
  command: bash /opt/scripts/check-memory-elasticsearch-metrics.sh
  interval: 60
  timeout: 50
  publish: true
  output_metric_format: graphite_plaintext
  output_metric_handlers:
  - graphite_instance
  subscriptions:
  - app