---
type: CheckConfig
api_version: core/v2
metadata:
  name: check_elasticsearch_query
  namespace: default
  annotations:
    fatigue_check/occurrences: '1'
    fatigue_check/interval: '3600'
    fatigue_check/allow_resolution: 'true'
spec:
  command: python /opt/scripts/check_elasticsearch_query.py
  handlers:
  - email
  - slack
  interval: 60
  timeout: 30
  publish: true
  subscriptions:
  - app