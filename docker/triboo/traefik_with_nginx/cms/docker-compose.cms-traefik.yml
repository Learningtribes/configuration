# Reference compose for Traefik + CMS + file sidecar.
# Adjust image names / volume mounts to match your Open edX host paths.

services:
  traefik:
    image: traefik:v3.2
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic/traefik.cms.yml
      - --providers.file.watch=true
      - --api.dashboard=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik.cms.yml:/etc/traefik/dynamic/traefik.cms.yml:ro
    depends_on:
      - cms-files
    extra_hosts:
      # So Traefik can reach CMS on the host (matches nginx upstream 127.0.0.1:8010)
      - "host.docker.internal:host-gateway"

  cms-files:
    image: nginx:1.27-alpine
    volumes:
      - ./cms-files.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /edx/var/edxapp/media:/edx/var/edxapp/media:ro
      - /edx/var/edxapp/staticfiles:/edx/var/edxapp/staticfiles:ro
      - /edx/var/edxapp/course_static:/edx/var/edxapp/course_static:ro
      - /edx/var/nginx/server-static:/edx/var/nginx/server-static:ro
      - /tmp/edx-s3/analytics:/tmp/edx-s3/analytics:ro
