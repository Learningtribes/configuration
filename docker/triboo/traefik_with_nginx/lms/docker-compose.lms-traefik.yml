# Reference compose for Traefik + LMS + file sidecar.
# Adjust image names / volume mounts to match your Open edX host paths.

services:
  traefik:
    image: traefik:v3.2
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic/traefik.lms.yml
      - --providers.file.watch=true
      - --api.dashboard=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik.lms.yml:/etc/traefik/dynamic/traefik.lms.yml:ro
    depends_on:
      - lms-files
    extra_hosts:
      # So Traefik can reach LMS on the host (matches nginx upstream 127.0.0.1:8000)
      - "host.docker.internal:host-gateway"

  # Serves paths that nginx previously handled with try_files / root
  lms-files:
    image: nginx:1.27-alpine
    volumes:
      - ./lms-files.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /edx/var/edxapp/media:/edx/var/edxapp/media:ro
      - /edx/var/edxapp/staticfiles:/edx/var/edxapp/staticfiles:ro
      - /edx/var/edxapp/course_static:/edx/var/edxapp/course_static:ro
      - /edx/var/edxapp/staticfiles/xblock/resources:/edx/var/edxapp/staticfiles/xblock/resources:ro
      - /edx/var/certs/www-data/downloads:/edx/var/certs/www-data/downloads:ro
      - /edx/var/nginx/server-static:/edx/var/nginx/server-static:ro
      - /tmp/edx-s3/analytics:/tmp/edx-s3/analytics:ro
