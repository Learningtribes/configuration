# Minimal nginx used only as a Traefik file sidecar for VEDA.
# Replicates try_files / root behaviour from nginx.veda for local paths.

server {
  listen 80;
  server_tokens off;

  location ~ ^/static/(?<file>.*)$ {
    root /edx/var/veda;
    try_files /staticfiles/$file =404;
  }

  location ~ ^/media/(?<file>.*)$ {
    root /edx/var/veda;
    try_files /media/$file =404;
  }

  location / {
    return 404;
  }
}
