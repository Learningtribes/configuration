# Single nginx file sidecar for Traefik.
# LMS/CMS use /edx/var/edxapp paths as-is.
# Discovery/VEDA paths are namespaced by Traefik rewrite middlewares:
#   /static|media/...  →  /discovery/static|media/...  or  /veda/static|media/...

server {
  listen 80;
  server_tokens off;

  # Deny helpers used by Traefik replacePath middlewares
  location = /__traefik/404 { return 404; }
  location = /__traefik/403 { return 403; }

  # ----- LMS / CMS (edxapp) -------------------------------------------------

  location ~ ^/server/(?<file>.*)$ {
    root /edx/var/nginx/server-static;
    try_files /$file =404;
  }

  location ~ ^/media/(?<file>.*)$ {
    root /edx/var/edxapp/media;
    try_files /$file /analytics-report/$file =404;
    expires 31536000s;
  }

  location ~ ^/analytics-report/(?<file>.*)$ {
    root /tmp/edx-s3/analytics;
    try_files /$file =404;
    expires 31536000s;
  }

  location ~ ^/downloads/(?<file>.*)$ {
    root /edx/var/certs/www-data/downloads;
    try_files /$file =404;
    expires 31536000s;
  }

  location ~ ^/xblock/resources/(?<file>.*)$ {
    root /edx/var/edxapp/staticfiles/xblock/resources;
    try_files /$file =404;
  }

  location ~ "^/static/js/triboo_analytics/(?<jsonfile>.*\.[0-9a-f]{12}\.json$)" {
    root /edx/var/edxapp/staticfiles/js/triboo_analytics;
    try_files /$jsonfile =404;
  }

  location ~ ^/static/(?<file>.*)$ {
    root /edx/var/edxapp;
    try_files /staticfiles/$file /course_static/$file =404;
  }

  # ----- Course Discovery (programs) ----------------------------------------

  location ~ ^/discovery/static/(?<file>.*)$ {
    root /edx/var/discovery;
    try_files /staticfiles/$file =404;
  }

  location ~ ^/discovery/media/(?<file>.*)$ {
    root /edx/var/discovery;
    try_files /media/$file =404;
  }

  # ----- VEDA ---------------------------------------------------------------

  location ~ ^/veda/static/(?<file>.*)$ {
    root /edx/var/veda;
    try_files /staticfiles/$file =404;
  }

  location ~ ^/veda/media/(?<file>.*)$ {
    root /edx/var/veda;
    try_files /media/$file =404;
  }

  location / {
    return 404;
  }
}
