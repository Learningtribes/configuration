apiVersion: v1
data:
  discovery.yml: |
    AWS_SES_REGION_ENDPOINT: email.us-east-1.amazonaws.com
    AWS_SES_REGION_NAME: us-east-1
    CACHES:
        default:
            BACKEND: django.core.cache.backends.memcached.PyMemcacheCache
            KEY_PREFIX: discovery
            LOCATION:
            - memcache
    CSRF_COOKIE_SECURE: false
    DATABASES:
        default:
            ATOMIC_REQUESTS: false
            CONN_MAX_AGE: 60
            ENGINE: django.db.backends.mysql
            HOST: mysql.everlearn.svc.cluster.local
            NAME: py3_discovery
            OPTIONS:
                connect_timeout: 10
                init_command: SET sql_mode='STRICT_TRANS_TABLES'
            PASSWORD: py3_password
            PORT: '3306'
            USER: py3_admin
    DEFAULT_PARTNER_ID: 1
    EDX_DRF_EXTENSIONS:
        OAUTH2_USER_INFO_URL: http://127.0.0.1/oauth2/user_info
    ELASTICSEARCH_INDEX_NAME: catalog
    ELASTICSEARCH_URL: http://127.0.0.1:9200/
    EMAIL_BACKEND: django_ses.SESBackend
    EMAIL_HOST: localhost
    EMAIL_HOST_PASSWORD: ''
    EMAIL_HOST_USER: ''
    EMAIL_PORT: 25
    EMAIL_USE_TLS: false
    EXTRA_APPS: []
    JWT_AUTH:
        JWT_ISSUERS:
        -   AUDIENCE: SET-ME-PLEASE
            ISSUER: http://127.0.0.1/oauth2
            SECRET_KEY: SET-ME-PLEASE
    LANGUAGE_CODE: en
    MEDIA_STORAGE_BACKEND:
        DEFAULT_FILE_STORAGE: django.core.files.storage.FileSystemStorage
        MEDIA_ROOT: /edx/var/discovery/media
        MEDIA_URL: /media/
    OPENEXCHANGERATES_API_KEY: ''
    PARLER_DEFAULT_LANGUAGE_CODE: en
    PARLER_LANGUAGES:
        1:
        -   code: en
        default:
            fallbacks:
            - en
            hide_untranslated: 'False'
    PLATFORM_NAME: Your Platform Name Here
    PUBLISHER_FROM_EMAIL: null
    SECRET_KEY: Your secret key here
    SESSION_EXPIRE_AT_BROWSER_CLOSE: false
    SOCIAL_AUTH_EDX_OIDC_ID_TOKEN_DECRYPTION_KEY: token
    SOCIAL_AUTH_EDX_OIDC_ISSUER: http://127.0.0.1/oauth2
    SOCIAL_AUTH_EDX_OIDC_KEY: key
    SOCIAL_AUTH_EDX_OIDC_LOGOUT_URL: http://127.0.0.1/logout
    SOCIAL_AUTH_EDX_OIDC_PUBLIC_URL_ROOT: http://127.0.0.1/oauth2
    SOCIAL_AUTH_EDX_OIDC_SECRET: secret
    SOCIAL_AUTH_EDX_OIDC_URL_ROOT: http://127.0.0.1/oauth2
    SOCIAL_AUTH_REDIRECT_IS_HTTPS: false
    STATICFILES_STORAGE: django.contrib.staticfiles.storage.StaticFilesStorage
    STATIC_ROOT: /edx/var/discovery/staticfiles
    TIME_ZONE: UTC
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: discovery
  name: discovery-cm0
